name: Windows binaries (Frontier + Project Everest)

on:
  push:
    branches: ['main', 'arena/ff6cc303-frontier']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  WindowsBuild:
    name: Build Frontier.exe and Everest.exe (Windows x64, one Release build)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare UI dependencies and fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check -r Automation/FontRequirements.txt
          python Automation/PrepareUI.py
          python Automation/PrepareFonts.py
      - name: Configure Windows x64 Release with ClangCL
        run: cmake -S . -B Build/Windows -A x64 -T ClangCL -DBUILD_TESTING=OFF
      - name: Build only Frontier and Project Everest
        shell: pwsh
        run: |
          $BuildLog = "Frontier-Everest-build.log"
          cmake --build Build/Windows --config Release --target Frontier Everest --parallel 2 2>&1 |
            Tee-Object -FilePath $BuildLog
          $BuildExit = $LASTEXITCODE
          if ($BuildExit -ne 0) {
            $BuildErrors = Select-String -Path $BuildLog -Pattern '(?i)(fatal error|error C[0-9]+|error LNK[0-9]+|error MSB[0-9]+|CMake Error|FAILED:|error:)' |
              Select-Object -First 25
            if ($BuildErrors.Count -eq 0) { $BuildErrors = Get-Content $BuildLog -Tail 40 }
            foreach ($Line in $BuildErrors) {
              if ($Line -is [Microsoft.PowerShell.Commands.MatchInfo]) { $LineText = $Line.Line } else { $LineText = [string]$Line }
              $Message = $LineText.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$Message"
            }
            exit $BuildExit
          }
      - name: Upload the two Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Frontier-Everest-Windows-x64
          path: |
            Build/Windows/Release/Frontier.exe
            Build/Windows/Release/Everest.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log for diagnosis
        if: failure() && hashFiles('Frontier-Everest-build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Frontier-Everest-Windows-build-log
          path: Frontier-Everest-build.log
          retention-days: 7
